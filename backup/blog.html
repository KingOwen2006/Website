<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
    (function () {
      // Make relative asset paths work on clean URLs (server), while still
      // supporting file:// double-click by rewriting internal clean links
      // (e.g. /projects -> projects.html).
      const isFile = location.protocol === "file:";

      if (!isFile) {
        const base = document.createElement("base");
        base.href = "/";
        document.head.appendChild(base);
        return;
      }

      const map = {
        "/": "index.html",
        "/edu": "edu.html",
        "/projects": "projects.html",
        "/blog": "blog.html",
        "/post": "post.html"
      };

      window.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('a[href^="/"]').forEach(a => {
          const href = a.getAttribute("href") || "";
          const baseHref = href.split("#")[0].split("?")[0];
          const replacement = map[baseHref];
          if (!replacement) return;
          a.setAttribute("href", replacement + href.slice(baseHref.length));
        });
      });
    })();
  </script>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="wordpress.css">
</head>
<body>

<header class="top-nav">
  <nav>
    <a href="index.html">

      <span>Home</span>
    </a>
    <a href="edu.html">
      <img class="nav-icon" src="SVG/human.svg" alt="" aria-hidden="true">
      <span>Education</span>
    </a>
    <a href="projects.html" class="active">
      <img class="nav-icon" src="SVG/pfp.svg" alt="" aria-hidden="true">
      <span>Personal</span>
    </a>
    <a href="#">
      <img class="nav-icon" src="SVG/contact.svg" alt="" aria-hidden="true">
      <span>Contact</span>
    </a>
    <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme">
      <img class="theme-toggle__icon" src="SVG/tooglelight.svg" data-light-src="SVG/tooglelight.svg" data-dark-src="SVG/toogledark.svg" alt="" aria-hidden="true">
    </button>
  </nav>
</header>

<div class="app">

  <aside class="sidebar">
    <nav>
      <a href="index.html">
        <img class="nav-icon" src="SVG/home.svg" alt="" aria-hidden="true">

</div>

<script src="wordpress.js" defer></script>
</body>

</html>
