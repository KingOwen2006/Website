<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#080808">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="apple-touch-icon" href="/assets/king-owen-192.png">
    <style>
      html { background: #080808; color-scheme: dark; }
      html[data-theme="light"] { background: #f3f5f8; color-scheme: light; }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]) { background: #f3f5f8; color-scheme: light; }
      }
      @media (prefers-reduced-motion: no-preference) {
        @view-transition { navigation: auto; }
      }
    </style>
    <meta name="description" content="Owen Moore's Bournemouth and Poole College course years and projects.">
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
    <title>Education | King Owen</title>
    <script>
      {
        let saved;
        try { saved = JSON.parse(localStorage.getItem("portfolio-preferences") || "null"); } catch {}
        const theme = saved?.theme === "light" || saved?.theme === "dark"
          ? saved.theme : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = saved?.accent ?? "blue";
        const colour = theme === "light" ? "#f3f5f8" : "#080808";
        document.querySelector('meta[name="color-scheme"]').content = theme;
        document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => { meta.content = colour; });
      }
      window.addEventListener("pagereveal", (event) => {
        window.portfolioPageTransition = event.viewTransition ?? null;
        event.viewTransition?.ready.catch(() => {});
      }, { once: true });
    </script>
    <script type="module" src="/src/education-page.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside class="rail" aria-label="Sidebar">
      <button class="rail-toggle rail-item" type="button" aria-label="Expand navigation" aria-expanded="false" aria-controls="site-navigation"></button>
      <nav id="site-navigation" aria-label="Main navigation"></nav>
    </aside>
    <main class="panel education" id="main">
      <div class="listing-content">
        <section id="education-listing" aria-labelledby="education-title">
          <h1 class="display-title" id="education-title">Education</h1>
          <p class="listing-intro">Coursework and projects from <strong>Bournemouth and Poole College</strong>.</p>
          <div class="listing-filters">
            <label for="education-search">Search posts</label>
            <input id="education-search" type="search" placeholder="Search coursework">
            <label for="education-grade">Grade</label>
            <select id="education-grade">
              <option value="">All grades</option>
              <option value="pass">Pass</option>
              <option value="merit">Merit</option>
              <option value="distinction">Distinction</option>
            </select>
          </div>
          <p id="education-status" class="education-status" role="status">Loading education posts…</p>
          <div id="education-posts" aria-busy="true">
            <section class="education-post-group" aria-hidden="true">
              <h2><span class="ghost-shape education-ghost-heading"></span></h2>
              <ul class="education-posts">
                <li><div class="education-post education-ghost"><div class="education-post-copy ghost-lines"><span class="ghost-shape"></span><span class="ghost-shape"></span></div></div></li>
                <li><div class="education-post education-ghost"><div class="education-post-copy ghost-lines"><span class="ghost-shape"></span><span class="ghost-shape"></span></div></div></li>
              </ul>
            </section>
          </div>
        </section>
        <section id="education-unit" class="education-article" hidden>
          <a class="education-article-action" href="#education-title">Back to Education</a>
          <article aria-labelledby="education-unit-title">
            <header class="education-unit-header">
              <img id="education-unit-image" alt="" width="96" height="96" hidden>
              <div>
                <p id="education-unit-course" class="education-unit-course"></p>
                <h1 id="education-unit-title" tabindex="-1"></h1>
              </div>
            </header>
            <p id="education-unit-status" role="status"></p>
            <p id="education-word-count" class="education-word-count" hidden></p>
            <div id="education-unit-body"></div>
          </article>
        </section>
      </div>
    </main>
    <template id="education-unit-loading">
      <div class="education-section-grid" aria-hidden="true">
        <div class="education-section-card ghost-lines"><span class="ghost-shape"></span><span class="ghost-shape"></span></div>
        <div class="education-section-card ghost-lines"><span class="ghost-shape"></span><span class="ghost-shape"></span></div>
      </div>
    </template>
    <dialog id="unit-lightbox" class="unit-lightbox" aria-label="Enlarged image">
      <form method="dialog"><button aria-label="Close image" autofocus>×</button></form>
      <img id="unit-lightbox-image" alt="">
    </dialog>
  </body>
</html>
