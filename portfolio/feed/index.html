<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <style>
      html { background: #080808; color-scheme: dark; }
      html[data-theme="light"] { background: #f3f5f8; color-scheme: light; }
      @media (prefers-reduced-motion: no-preference) {
        @view-transition { navigation: auto; }
      }
    </style>
    <meta name="description" content="Original posts from King Owen on X.">
    <link rel="preconnect" href="https://api.fxtwitter.com" crossorigin>
    <link rel="preconnect" href="https://pbs.twimg.com" crossorigin>
    <title>Feed | King Owen</title>
    <script>
      {
        let saved;
        try { saved = JSON.parse(localStorage.getItem("portfolio-preferences") || "null"); } catch {}
        const theme = saved?.theme === "light" || saved?.theme === "dark"
          ? saved.theme : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = saved?.accent ?? "blue";
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f3f5f8" : "#080808";
      }
      window.addEventListener("pagereveal", (event) => {
        window.portfolioPageTransition = event.viewTransition ?? null;
        event.viewTransition?.ready.catch(() => {});
      }, { once: true });
    </script>
    <script type="module" src="/src/feed-page.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <aside class="rail" aria-label="Sidebar">
      <button class="rail-toggle rail-item" type="button" aria-label="Expand navigation" aria-expanded="false" aria-controls="site-navigation"></button>
      <nav id="site-navigation" aria-label="Main navigation"></nav>
    </aside>
    <main class="panel feed-page" id="main">
      <div class="listing-content">
        <header>
          <h1 class="display-title">Feed</h1>
          <p class="listing-intro">Original posts from <a class="feed-profile" href="https://x.com/KingOwenFYI" target="_blank" rel="noopener noreferrer">@KingOwenFYI</a> on X<span id="feed-followers" role="status"></span></p>
          <div class="listing-filters">
            <label for="feed-search">Search posts</label>
            <input id="feed-search" type="search" placeholder="Search posts">
            <details class="feed-filter">
              <summary><img src="/icons/filter.svg" alt="" width="24" height="24">Filter</summary>
              <form class="feed-filter-menu" aria-label="Filter posts">
                <fieldset>
                  <legend>Sort by</legend>
                  <label><span>Newest</span><input type="radio" name="sort" value="newest" checked></label>
                  <label><span>Most liked</span><input type="radio" name="sort" value="likes"></label>
                  <label><span>Most viewed</span><input type="radio" name="sort" value="views"></label>
                  <label><span>Most reposted</span><input type="radio" name="sort" value="reposts"></label>
                  <label><span>Most comments</span><input type="radio" name="sort" value="replies"></label>
                </fieldset>
              </form>
            </details>
          </div>
        </header>
        <p id="feed-page-status" role="status">Loading posts…</p>
        <div id="feed-list" class="feed-list" aria-label="Posts" aria-busy="true">
          <article class="card feed-card feed-timeline-post feed-ghost" aria-hidden="true">
            <div class="feed-timeline-author"><span class="ghost-shape feed-ghost-author"></span></div>
            <div class="feed-card-body ghost-lines"><span class="ghost-shape"></span><span class="ghost-shape"></span></div>
            <div class="feed-card-stats"><span class="ghost-shape feed-ghost-stats"></span></div>
          </article>
          <article class="card feed-card feed-timeline-post feed-ghost" aria-hidden="true">
            <div class="feed-timeline-author"><span class="ghost-shape feed-ghost-author"></span></div>
            <div class="feed-card-body ghost-lines"><span class="ghost-shape"></span><span class="ghost-shape"></span></div>
            <div class="feed-card-stats"><span class="ghost-shape feed-ghost-stats"></span></div>
          </article>
        </div>
        <button id="feed-retry" class="detail-link" type="button" hidden>Try again</button>
      </div>
    </main>
  </body>
</html>
