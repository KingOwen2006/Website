<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KingOwen | Unit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  img{-webkit-user-drag:none;-moz-user-drag:none}
  :root{
    --bg:#060b14;
    --accent:#64ffda;
    --accent2:#48b1ff;
    --accent3:#a78bfa;
    --text:#e2e8f0;
    --text-muted:#8899aa;
    --muted:#8899aa;
    --glass:rgba(15,25,40,.55);
    --glass-border:rgba(100,200,255,.1);
    --glass-blur:24px;
    --panel:rgba(12,18,28,.85);
    --panel-soft:rgba(15,25,40,.4);
    --border:rgba(100,200,255,.08);
    --radius:14px;
  }
  [data-theme="light"]{
    --bg:#eaf0f6;
    --text:#1a2332;
    --text-muted:#556677;
    --muted:#556677;
    --glass:rgba(255,255,255,.72);
    --glass-border:rgba(0,50,120,.08);
    --panel:rgba(255,255,255,.9);
    --panel-soft:rgba(240,244,248,.8);
    --border:rgba(0,50,120,.08);
  }
  [data-theme="light"] body{background:#eaf0f6}
  [data-theme="light"] canvas#bg{opacity:1}
  [data-theme="light"] .vignette{background:radial-gradient(ellipse at center,transparent 50%,rgba(234,240,246,.5) 100%)}
  [data-theme="light"] .noise{opacity:.015}
  [data-theme="light"] .back-bar{background:rgba(234,240,246,.88);border-bottom-color:rgba(0,50,120,.06)}
  [data-theme="light"] .back-bar .back-link{color:#556677}
  [data-theme="light"] .back-bar .back-link:hover{color:#0d6b4c}
  [data-theme="light"] .back-bar__settings{color:#556677}
  [data-theme="light"] .back-bar__settings:hover{color:#0d6b4c;background:rgba(0,80,120,.06)}
  [data-theme="light"] #post h1{background:linear-gradient(135deg,#0a3d50,#0d6b4c,#1a5a8a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  [data-theme="light"] .post-content{background:rgba(255,255,255,.88);border-color:rgba(0,50,120,.07);box-shadow:0 2px 16px rgba(0,40,80,.06)}
  [data-theme="light"] .post-content h2{border-top-color:rgba(0,50,120,.06)}
  [data-theme="light"] .post-content a{color:#0d6b4c}
  [data-theme="light"] .post-content a:hover{color:#1a5a8a}
  [data-theme="light"] .post-content blockquote{background:rgba(0,50,100,.03);border-left-color:var(--accent)}
  [data-theme="light"] .post-content code{background:rgba(0,50,100,.04);border-color:rgba(0,50,120,.08)}
  [data-theme="light"] .post-content pre{background:#f4f6f9;color:#1a2332;border-color:rgba(0,50,120,.06)}
  [data-theme="light"] .settings-popup__backdrop{background:rgba(0,0,0,.25)}
  [data-theme="light"] .settings-popup__panel{background:rgba(255,255,255,.88);border-color:rgba(0,50,120,.08);box-shadow:0 20px 50px rgba(0,40,80,.12)}
  [data-theme="light"] .settings-popup__title{color:#0d6b4c}
  [data-theme="light"] .settings-label{color:#556677}
  [data-theme="light"] .settings-option{color:#556677;background:rgba(0,50,100,.03);border-color:rgba(0,50,120,.1)}
  [data-theme="light"] .settings-option:hover{color:#0d6b4c;border-color:rgba(13,107,76,.2);background:rgba(13,107,76,.05)}
  [data-theme="light"] .settings-option.active{color:#0d6b4c;background:rgba(13,107,76,.08);border-color:rgba(13,107,76,.25)}
  [data-theme="light"] .settings-accent-btn.active{border-color:#1a2332}
  body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;overflow-x:hidden;min-height:100vh}
  canvas#bg{position:fixed;top:0;left:0;z-index:0}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 40%,rgba(6,11,20,.85) 100%)}
  .noise{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

  .back-bar{position:fixed;top:0;left:0;right:0;z-index:10;padding:.8rem 2rem;background:rgba(6,11,20,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:1rem}
  .back-bar .back-link{color:var(--muted);text-decoration:none;font-size:.8rem;font-weight:500;letter-spacing:1px;display:flex;align-items:center;gap:.4rem;transition:color .2s}
  .back-bar .back-link:hover{color:var(--accent)}
  .back-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
  .back-bar__settings{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;padding:.5rem;border-radius:10px;transition:color .2s,background .2s}
  .back-bar__settings:hover{color:var(--accent);background:rgba(100,255,218,.06)}
  .back-bar__settings svg{width:20px;height:20px;display:block}
  .settings-popup{position:fixed;inset:0;z-index:1000;pointer-events:none;opacity:0;transition:opacity .25s}
  .settings-popup.is-open{pointer-events:auto;opacity:1}
  .settings-popup__backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);cursor:pointer}
  .settings-popup__panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:18px;padding:1.8rem 2rem;min-width:280px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .settings-popup__title{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:1.5rem}
  .settings-group{margin-bottom:1.4rem}
  .settings-group:last-child{margin-bottom:0}
  .settings-label{display:block;font-size:.7rem;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:.5rem}
  .settings-options{display:flex;flex-wrap:wrap;gap:.4rem}
  .settings-option{padding:.45rem .9rem;font-size:.78rem;font-weight:500;color:var(--text-muted);background:rgba(255,255,255,.04);border:1px solid var(--glass-border);border-radius:8px;cursor:pointer;transition:all .2s}
  .settings-option:hover{color:var(--accent);border-color:rgba(100,255,218,.2)}
  .settings-option.active{color:var(--accent);background:rgba(100,255,218,.1);border-color:rgba(100,255,218,.25)}
  .settings-accent{display:flex;gap:.5rem;flex-wrap:wrap}
  .settings-accent-btn{width:32px;height:32px;border-radius:10px;border:2px solid transparent;background:var(--swatch);cursor:pointer;transition:border-color .2s,transform .2s}
  .settings-accent-btn:hover{transform:scale(1.08)}
  .settings-accent-btn.active{border-color:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}

  .page-wrap{position:relative;z-index:2;max-width:1250px;margin:0 auto;padding:5rem 2rem 4rem}

  #post{min-height:60vh}

  #post h1{font-family:'Space Grotesk',sans-serif;font-size:2.4rem;font-weight:800;line-height:1.2;margin-bottom:14px;background:linear-gradient(135deg,#e2f0ff,#64ffda,#48b1ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

  .back-link{display:inline-block;margin-bottom:20px;color:var(--muted)}
  .back-link:hover{color:var(--accent)}
  .word-count{font-size:.9rem;color:var(--muted);margin-bottom:24px}

  /* Links inside posts — red/accent */
  .post-content a{color:var(--accent);text-decoration:underline}
  .post-content a:hover{color:var(--accent2)}
  .post-content a{word-break:break-word;overflow-wrap:anywhere}

  /* Post content panel */
  .post-content{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:40px;
    max-width:1250px;
    margin:20px auto 0;
    color:var(--text);
  }

  .post-content h1{font-size:2.4rem;line-height:1.2;font-weight:800;margin-bottom:14px}
  .post-content h2{
    font-size:1.7rem;
    font-weight:700;
    margin:40px 0 12px;
    padding-top:12px;
    border-top:1px solid var(--border);
  }
  .post-content h3{font-size:1.3rem;font-weight:600;margin:28px 0 10px;color:var(--text)}
  .post-content p{margin:12px 0;font-size:1.05rem;line-height:1.75;color:var(--text)}
  .post-content ul,.post-content ol{margin:14px 0 14px 22px}
  .post-content li{margin:8px 0}
  .post-content blockquote{
    margin:20px 0;
    padding:16px 20px;
    border-left:4px solid var(--accent);
    background:var(--panel-soft);
    color:var(--text);
    border-radius:8px;
  }
  .post-content code{
    background:var(--panel-soft);
    padding:3px 6px;
    border-radius:6px;
    border:1px solid var(--border);
    font-size:.95rem;
    color:var(--text);
  }
  .post-content pre{
    background:#0d0f17;
    color:#e6e8ee;
    padding:18px;
    border-radius:14px;
    overflow:auto;
    margin:18px 0;
    font-size:.95rem;
    border:1px solid rgba(255,255,255,.06);
  }

  /* Centered images — clickable for lightbox */
  .post-content img{
    cursor:pointer;
    display:block;
    width:100%!important;
    max-width:1000px!important;
    height:auto!important;
    margin:40px auto;
    border-radius:14px;
  }
  .post-content a img,.post-content figure img{
    width:100%!important;
    max-width:1000px!important;
    height:auto!important;
  }

  /* Image compare (Jetpack → ko-compare via JS) — click to open in lightbox */
  .post-content .ko-compare{margin:40px auto;max-width:1000px;cursor:pointer}
  .post-content .ko-compare__viewport{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--border);
    background:#0b0f1a;
    user-select:none;
    touch-action:none;
    cursor:col-resize;
  }
  .post-content .ko-compare__viewport::after{
    content:"";
    position:absolute;
    top:0;bottom:0;
    left:var(--pos,50%);
    transform:translateX(-1px);
    width:2px;
    background:rgba(255,255,255,.7);
    pointer-events:none;
  }
  .post-content .ko-compare img,
  .post-content .ko-compare a img,
  .post-content figure.ko-compare img{
    width:100%!important;
    max-width:none!important;
    height:100%!important;
    margin:0!important;
    border-radius:0!important;
    object-fit:cover;
    display:block;
  }
  .post-content .ko-compare__img--before{
    position:absolute;
    inset:0;
    clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0);
  }
  .post-content .ko-compare__img--after{
    position:absolute;
    inset:0;
    clip-path:inset(0 0 0 var(--pos,50%));
  }
  .post-content .ko-compare__handle{
    position:absolute;
    top:0;
    left:var(--pos,50%);
    transform:translateX(-50%);
    width:0;
    height:100%;
    pointer-events:none;
  }
  .post-content .ko-compare__handle::before{
    content:"";
    position:absolute;
    top:50%;left:0;
    transform:translate(-50%,-50%);
    width:42px;height:42px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--panel);
    box-shadow:0 8px 18px rgba(0,0,0,.25);
  }
  .post-content .ko-compare__handle::after{
    content:"↔";
    position:absolute;
    top:50%;left:0;
    transform:translate(-50%,-50%);
    font-weight:800;
    color:var(--accent);
    line-height:1;
  }

  .post-content img[data-wide="true"]{max-width:1200px!important}
  .post-content img[data-narrow="true"]{max-width:800px!important}

  /* WordPress image captions */
  .post-content .wp-element-caption{
    margin-top:10px;
    font-size:.9rem;
    line-height:1.5;
    color:var(--muted);
    text-align:center;
    padding:6px 10px;
    max-width:100%;
  }
  .post-content figure{margin:40px auto;max-width:1000px}
  .post-content figure>.wp-element-caption{margin-top:14px;padding-top:10px}
  .post-content .wp-element-caption::before{content:"— ";color:var(--accent);opacity:.6}

  /* Figma embeds */
  .figma-wrapper{
    position:relative;
    width:100%;
    max-width:1000px;
    margin:40px auto;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--panel);
  }
  .figma-wrapper iframe{width:100%;min-height:700px;border:0;background:var(--panel)}
  .figma-wrapper .embed-mobile-link{display:none;padding:0.5rem 1rem;background:var(--panel-soft);color:var(--accent);text-decoration:none;font-weight:600;font-size:0.85rem;text-align:center;border-radius:10px;border:1px dashed var(--accent);transition:background .2s,color .2s;align-items:center;justify-content:center;white-space:nowrap}
  .figma-wrapper .embed-mobile-link:hover{background:rgba(100,255,218,.1);color:var(--accent2)}
  /* 3D model embeds (GLB viewer) */
  .model-viewer-wrapper .glb-viewer{position:relative;width:100%;min-height:500px;background:var(--panel);display:block}
  .model-viewer-wrapper .glb-viewer__canvas{width:100%;height:100%;min-height:500px;display:block}
  .glb-viewer__settings-btn{position:absolute;top:12px;right:56px;width:36px;height:36px;border:none;border-radius:8px;background:rgba(0,0,0,.6);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .2s,color .2s;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .glb-viewer__settings-btn:hover{background:rgba(100,255,218,.15);color:var(--accent2)}
  .glb-viewer__settings-btn svg{width:18px;height:18px}
  .glb-viewer__mode-menu{position:absolute;top:54px;right:56px;background:rgba(12,18,28,.95);border:1px solid var(--border);border-radius:10px;padding:6px;z-index:3;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s,visibility .2s,transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .glb-viewer__mode-menu.open{opacity:1;visibility:visible;transform:translateY(0)}
  .glb-viewer__mode-menu button{display:block;width:100%;padding:10px 16px;border:none;border-radius:8px;background:transparent;color:var(--text-muted);font-size:.9rem;font-weight:500;cursor:pointer;text-align:left;transition:background .2s,color .2s}
  .glb-viewer__mode-menu button:hover{background:rgba(100,255,218,.08);color:var(--accent)}
  .glb-viewer__mode-menu button.active{background:rgba(100,255,218,.12);color:var(--accent)}
  @media(max-width:1023px){
    .figma-wrapper iframe{display:none!important}
    .figma-wrapper .embed-mobile-link{display:flex!important}
    .figma-wrapper .ko-lightbox-expand-btn{display:none!important}
    .model-viewer-wrapper .glb-viewer,.model-viewer-wrapper .glb-viewer__canvas{min-height:400px}
    .model-viewer-wrapper .glb-viewer__settings-btn,.model-viewer-wrapper .glb-viewer__mode-menu{right:12px}
  }

  /* Video / non-Figma iframes */
  .post-content video,.post-content iframe:not(.figma-wrapper iframe){
    display:block;
    width:100%;
    max-width:1000px;
    aspect-ratio:16/9;
    height:auto;
    margin:40px auto;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    border:1px solid var(--border);
  }

  /* WordPress block normalization */
  .post-content .wp-block-group,
  .post-content .wp-block-columns,
  .post-content .wp-block-column,
  .post-content .wp-block-media-text,
  .post-content .wp-block-table,
  .post-content .wp-block-quote,
  .post-content .wp-block-code,
  .post-content .wp-block-preformatted{
    background:transparent;
    color:var(--text);
    border-color:var(--border);
  }

  /* WordPress tables */
  .post-content .wp-block-table{
    margin:28px 0;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
  }
  .post-content .wp-block-table table{width:100%;border-collapse:collapse;min-width:600px}
  .post-content .wp-block-table thead th{
    background:var(--accent);
    color:#fff;
    font-weight:700;
    border-bottom:1px solid var(--border);
  }
  .post-content .wp-block-table th,.post-content .wp-block-table td{
    padding:12px 14px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    text-align:left;
    vertical-align:top;
    color:var(--text);
    background:transparent;
  }
  .post-content .wp-block-table tr:last-child td{border-bottom:0}
  .post-content .wp-block-table th:last-child,.post-content .wp-block-table td:last-child{border-right:0}
  .post-content .wp-block-table tbody tr:nth-child(even) td{background:rgba(0,0,0,.03)}

  .post-content table,.post-content th,.post-content td{border-color:var(--border);color:var(--text)}

  /* WordPress image rows (flex/grid) */
  .post-content .wp-block-group.is-layout-flex{
    display:flex;
    gap:24px;
    align-items:flex-start;
    margin:40px 0;
  }
  .post-content .wp-block-group.is-nowrap.is-layout-flex{flex-wrap:nowrap}
  .post-content .wp-block-group.is-layout-flex>.wp-block-image{flex:0 0 45%;margin:0}
  .post-content .wp-block-group.is-layout-flex>:not(.wp-block-image){flex:1 1 55%}
  .post-content .wp-block-group.is-layout-flex>.wp-block-image img,
  .post-content .wp-block-group.is-layout-flex>.wp-block-image img.size-large{
    width:100%!important;
    max-width:none!important;
    max-height:420px;
    height:auto!important;
    object-fit:contain;
    display:block;
    margin:0!important;
    border-radius:14px;
  }

  .post-content .wp-block-group.is-layout-grid{
    display:grid;
    grid-template-columns:45% 1fr;
    gap:24px;
    align-items:start;
    margin:40px 0;
  }
  .post-content .wp-block-group.is-layout-grid>.wp-block-image img,
  .post-content .wp-block-group.is-layout-grid>.wp-block-image img.size-large{
    width:100%!important;
    max-width:none!important;
    max-height:420px;
    height:auto!important;
    object-fit:contain;
    display:block;
    border-radius:14px;
  }

  /* WordPress gallery */
  .post-content .wp-block-gallery{
    display:grid;
    gap:16px;
    margin:40px auto;
    max-width:1000px;
  }
  .post-content .wp-block-gallery.columns-2{grid-template-columns:repeat(2,1fr)}
  .post-content .wp-block-gallery.columns-3{grid-template-columns:repeat(3,1fr)}
  .post-content .wp-block-gallery .wp-block-image{margin:0}
  .post-content .wp-block-gallery .wp-block-image img{
    width:100%!important;
    height:auto!important;
    object-fit:cover;
    border-radius:12px;
  }

  /* Loader */
  .ko-wp-inline-loader{text-align:center;padding:4rem 2rem}
  .ko-wp-inline-loader__text{color:var(--text-muted);font-size:.85rem;letter-spacing:1px}
  .ko-wp-inline-loader__bar{width:120px;height:2px;margin:1rem auto 0;background:rgba(100,255,218,.1);border-radius:2px;overflow:hidden;position:relative}
  .ko-wp-inline-loader__bar::after{content:'';position:absolute;inset:0;width:40%;background:var(--accent);border-radius:2px;animation:loadslide 1.2s ease-in-out infinite}
  @keyframes loadslide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

  @media(max-width:768px){
    .post-content{padding:24px 20px}
    .post-content .ko-compare{margin:28px auto}
    .post-content .ko-compare__handle::before{width:38px;height:38px}
    .post-content .wp-element-caption{font-size:.85rem;line-height:1.6;padding:8px 12px;text-align:left}
    .post-content figure{margin:28px auto}
    .post-content figure>.wp-element-caption{margin-top:10px;padding-top:8px}
    .post-content .wp-block-group.is-layout-flex,
    .post-content .wp-block-group.is-layout-grid{grid-template-columns:1fr;display:block}
    .post-content .wp-block-gallery.columns-2,.post-content .wp-block-gallery.columns-3{grid-template-columns:1fr}
  }
</style>

</head>
<body>
<canvas id="bg"></canvas>
<div class="vignette"></div>
<div class="noise"></div>

<div class="back-bar">
  <a href="/" class="back-link">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
  <button class="back-bar__settings" id="nav-settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</div>
<div class="settings-popup" id="settings-popup">
  <div class="settings-popup__backdrop" id="settings-backdrop"></div>
  <div class="settings-popup__panel">
    <h3 class="settings-popup__title">Settings</h3>
    <div class="settings-group">
      <label class="settings-label">Theme</label>
      <div class="settings-options">
        <button class="settings-option" data-setting="theme" data-value="auto">Auto</button>
        <button class="settings-option active" data-setting="theme" data-value="dark">Dark</button>
        <button class="settings-option" data-setting="theme" data-value="light">Light</button>
      </div>
    </div>
    <div class="settings-group">
      <label class="settings-label">Accent colour</label>
      <div class="settings-options settings-accent">
        <button class="settings-accent-btn active" data-accent="default" title="Default" style="--swatch:#64ffda"></button>
        <button class="settings-accent-btn" data-accent="blue" title="Blue" style="--swatch:#48b1ff"></button>
        <button class="settings-accent-btn" data-accent="purple" title="Purple" style="--swatch:#a78bfa"></button>
        <button class="settings-accent-btn" data-accent="green" title="Green" style="--swatch:#3fb950"></button>
        <button class="settings-accent-btn" data-accent="coral" title="Coral" style="--swatch:#ff6b6b"></button>
        <button class="settings-accent-btn" data-accent="amber" title="Amber" style="--swatch:#f59e0b"></button>
      </div>
    </div>
    <div class="settings-group">
      <label class="settings-label">View mode</label>
      <div class="settings-options">
        <button class="settings-option active" data-setting="viewmode" data-value="wireframe">Wireframe</button>
        <button class="settings-option" data-setting="viewmode" data-value="solid">Solid</button>
      </div>
    </div>
  </div>
</div>

<div class="page-wrap">
  <div id="post"></div>
</div>

<script src="settings.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060b14, .015);
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060b14);
camera.position.set(0, 5, 18);
camera.lookAt(0, 0, 0);

const planeW = 120, segW = 70;
const geo = new THREE.PlaneGeometry(planeW, planeW, segW, segW);
geo.rotateX(-Math.PI / 2);
const matWire = new THREE.MeshBasicMaterial({ color: 0x48b1ff, wireframe: true, transparent: true, opacity: .04 });
const matSolid = new THREE.MeshBasicMaterial({ color: 0x48b1ff, wireframe: false, transparent: true, opacity: .5 });
const plane = new THREE.Mesh(geo, matWire);
plane.position.y = -3;
scene.add(plane);

const pGeo = new THREE.BufferGeometry();
const pCount = 300;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  pPos[i * 3] = (Math.random() - .5) * 60;
  pPos[i * 3 + 1] = Math.random() * 15 - 3;
  pPos[i * 3 + 2] = (Math.random() - .5) * 60;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0x64ffda, size: .06, transparent: true, opacity: .2, depthWrite: false });
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

let t = 0, lastT = '', lastV = '';
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

window.applySceneViewMode = function(mode) {
  plane.material = mode === 'solid' ? matSolid : matWire;
};
try { const sv = localStorage.getItem('ko-settings-viewmode'); if (sv) window.applySceneViewMode(sv); } catch(_) {}

function animate() {
  requestAnimationFrame(animate);
  t += .008;
  const isLight = (document.documentElement.getAttribute('data-theme') || 'dark') === 'light';
  const isSolid = (document.documentElement.getAttribute('data-viewmode') || 'wireframe') === 'solid';

  const curT = isLight ? 'l' : 'd', curV = isSolid ? 's' : 'w';
  if (curT !== lastT || curV !== lastV) {
    lastT = curT; lastV = curV;
    const hex = isLight ? 0xeaf0f6 : 0x060b14;
    renderer.setClearColor(hex);
    scene.fog.color.setHex(hex);
    plane.material = isSolid ? matSolid : matWire;
  }

  matWire.opacity = isLight ? .18 : .04;
  matSolid.opacity = isLight ? .6 : .5;
  scene.fog.density = isLight ? .006 : .015;
  pMat.opacity = isSolid ? 0 : (isLight ? .4 : .2);
  particles.visible = !isSolid;

  const p = plane.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, Math.sin(x * .1 + t) * Math.cos(z * .1 + t) * .4);
  }
  p.needsUpdate = true;
  renderer.render(scene, camera);
}
animate();
</script>
<script src="glb-viewer.js"></script>
<script src="wp-lightbox.js"></script>
<script src="wp.js"></script>
</body>
</html>
